# Пример конфигурации Apache для Laravel сайта
# Файл: /etc/apache2/sites-available/example.freedomvibe.net.conf

# VirtualHost для порта 8080 (HTTP - используется Nginx для proxy)
<VirtualHost *:8080>
    ServerName example.freedomvibe.net
    ServerAlias www.example.freedomvibe.net
    DocumentRoot /var/www/example/public
    
    <Directory /var/www/example/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # PHP-FPM через Unix socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm-example.sock|fcgi://localhost"
    </FilesMatch>
    
    ErrorLog /log/sites/example_error.log
    CustomLog /log/sites/example_access.log combined
</VirtualHost>

