# Пример default конфигурации Apache для IP-адреса
# Файл: /etc/apache2/sites-available/000-default.conf
# Используется для доступа по IP (например, phpMyAdmin)

<VirtualHost *:8080>
    ServerName 91.98.79.139
    DocumentRoot /var/www/freedomvibe.net
    
    <Directory /var/www/freedomvibe.net>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
