# Пример default конфигурации Nginx для IP-адреса
# Файл: /etc/nginx/sites-available/default-ip.conf

# HTTP default (для доступа по IP, например phpMyAdmin)
server {
    listen 80 default_server;
    server_name _;
    
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS default - закрыт для безопасности
server {
    listen 443 ssl http2 default_server;
    server_name _;
    
    # Self-signed сертификат (или любой)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    
    # Закрыть соединение
    return 444;
}
