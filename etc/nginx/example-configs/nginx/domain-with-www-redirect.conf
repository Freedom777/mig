# Пример конфигурации Nginx с отдельными сертификатами для domain и www
# Файл: /etc/nginx/sites-available/freedomvibe.net.conf

# HTTP -> HTTPS redirect (для обоих доменов)
server {
    listen 80;
    server_name freedomvibe.net www.freedomvibe.net;
    return 301 https://$server_name$request_uri;
}

# HTTPS для freedomvibe.net (основной)
server {
    listen 443 ssl http2;
    server_name freedomvibe.net;
    
    ssl_certificate /etc/letsencrypt/live/freedomvibe.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freedomvibe.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    access_log /log/sites/freedomvibe-access.log;
    error_log /log/sites/freedomvibe-error.log;
    
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}

# HTTPS для www.freedomvibe.net (редирект на основной)
server {
    listen 443 ssl http2;
    server_name www.freedomvibe.net;
    
    ssl_certificate /etc/letsencrypt/live/www.freedomvibe.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.freedomvibe.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Редирект www -> non-www
    return 301 https://freedomvibe.net$request_uri;
}
