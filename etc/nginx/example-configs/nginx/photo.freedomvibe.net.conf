server {
    listen 80;
    server_name photo.freedomvibe.net;

    root /var/www/photo/public;
    index index.php index.html;

    # Логи
    access_log /var/log/nginx/photo-access.log;
    error_log /var/log/nginx/photo-error.log;

    # Статика - отдаём напрямую (БЫСТРО!)
    location /images/ {
        alias /var/www/photo/storage/app/public/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /thumbnails/ {
        alias /var/www/photo/storage/app/public/images/300x200/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /debug-images/ {
        alias /var/www/photo/storage/app/public/images/debug/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Всё остальное -> Apache (PHP)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
